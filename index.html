<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuni Store</title>
    
    <!-- โหลด Tailwind CSS เพื่อให้ดีไซน์ของเว็บทำงานได้ -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- โหลด Babel สำหรับคอมไพล์โค้ด React/JSX ใน Browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <!-- พื้นที่สำหรับนำโค้ด React มาแสดงผล -->
    <div id="root"></div>

    <!-- โค้ดเดิมของคุณทั้งหมดอยู่ในนี้ (เปลี่ยน import เพื่อให้ทำงานบนเว็บตรงๆ ได้) -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'https://esm.sh/react@18';
        import { createRoot } from 'https://esm.sh/react-dom@18/client';
        import {
          Calendar, Image as ImageIcon, ShoppingBag, ListOrdered,
          Phone, CheckCircle, Clock, User, Shield, LogOut,
          Copy, Search, MessageCircle, Star, Edit, Plus, Save, X, AlertCircle, Sun, Moon
        } from 'https://esm.sh/lucide-react?deps=react@18';

        // สร้างไอคอน Facebook แบบ Manual เพื่อแก้ปัญหา CDN หาไฟล์ไม่เจอ
        const Facebook = ({ size = 24, className }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
          </svg>
        );

        // --- STREAMING_CHUNK:สไตล์พื้นหลังที่ลูกค้าให้มา + ฟอนต์ Prompt ---
        const BackgroundStyle = () => (
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');
           
            @keyframes float-up-down {
              0%, 100% { transform: translateY(0px) rotate(0deg); }
              50% { transform: translateY(-20px) rotate(5deg); }
            }
            @keyframes float-left-right {
              0%, 100% { transform: translateX(0px) rotate(0deg); }
              50% { transform: translateX(25px) rotate(-5deg); }
            }
            @keyframes pulse-soft {
              0%, 100% { transform: scale(1); opacity: 0.7; }
              50% { transform: scale(1.05); opacity: 1; }
            }
            @keyframes spin-slow {
              100% { transform: rotate(360deg); }
            }
            @keyframes bubble-float-up-continuous {
              0% { transform: translateY(110vh) scale(0.5); opacity: 0; }
              10% { opacity: 0.6; }
              90% { opacity: 0.6; }
              100% { transform: translateY(-20vh) scale(1.2); opacity: 0; }
            }
            @keyframes drift {
              0%, 100% { transform: translate(0, 0); }
              50% { transform: translate(40px, -30px); }
            }
            @keyframes rotate-soft {
              0% { transform: rotate(0deg); }
              100% { transform: rotate(360deg); }
            }
            .anim-float-1 { animation: float-up-down 6s ease-in-out infinite; }
            .anim-float-2 { animation: float-up-down 7s ease-in-out infinite 1s; }
            .anim-float-4 { animation: float-left-right 6.5s ease-in-out infinite 2s; }
            .anim-pulse { animation: pulse-soft 4s ease-in-out infinite; }
            .anim-spin { animation: spin-slow 12s linear infinite; }
            .anim-bubble { animation: bubble-float-up-continuous 11s linear infinite; animation-fill-mode: backwards; }
            .anim-rotate { animation: rotate-soft 20s linear infinite; }
            .anim-drift { animation: drift 15s ease-in-out infinite; }
            .bubble-gradient {
              background: radial-gradient(circle at 30% 30%, #ffffff, #fbcfe8);
              border-radius: 50%;
              box-shadow: inset -5px -5px 10px rgba(236, 72, 153, 0.2), 2px 2px 5px rgba(0,0,0,0.05);
              backdrop-filter: blur(2px);
            }

            /* --- Dark Mode Styles (อัปเกรดให้มีมิติ หรูหรา เรืองแสง) --- */
            .dark-mode {
              /* ไล่สีพื้นหลังแบบวงกลม ให้ดูลึก มีมิติ และพรีเมียมขึ้น */
              background: radial-gradient(circle at top left, #2D1445, #11081F 40%, #0B0514 100%) !important;
              color: #F8FAFC !important;
            }
            
            /* ปรับแต่ง Card และกล่องต่างๆ ให้เป็น Glassmorphism แบบพรีเมียม */
            .dark-mode .bg-white, 
            .dark-mode .bg-white\\/70, 
            .dark-mode .bg-white\\/80, 
            .dark-mode .bg-white\\/90 {
              background: linear-gradient(135deg, rgba(56, 30, 87, 0.6) 0%, rgba(30, 16, 50, 0.8) 100%) !important;
              backdrop-filter: blur(16px) !important;
              -webkit-backdrop-filter: blur(16px) !important;
              border-color: rgba(249, 168, 212, 0.15) !important; /* ขอบสีชมพูเรืองแสงบางๆ */
              box-shadow: 0 10px 40px -10px rgba(0,0,0, 0.7), inset 0 1px 0 rgba(255,255,255,0.05) !important; /* เงาดูมีมิติซ้อนกัน */
            }

            /* กล่องรองลงมา (เช่น พื้นหลังรูปภาพ ป้ายขั้นตอน) */
            .dark-mode .bg-pink-50, 
            .dark-mode .bg-pink-100, 
            .dark-mode .bg-gray-50, 
            .dark-mode .bg-gray-100, 
            .dark-mode .bg-gray-200 {
              background: rgba(45, 24, 69, 0.5) !important;
              border-color: rgba(249, 168, 212, 0.1) !important;
              box-shadow: inset 0 2px 10px rgba(0,0,0,0.2) !important;
            }

            /* จัดการสีตัวหนังสือให้อ่านง่ายและเพิ่มความเรืองแสงให้หัวข้อ */
            .dark-mode .text-gray-800, 
            .dark-mode .text-gray-700, 
            .dark-mode .text-gray-600 {
              color: #E2E8F0 !important;
            }
            .dark-mode .text-gray-500, 
            .dark-mode .text-gray-400 {
              color: #CBD5E1 !important;
            }
            .dark-mode .text-pink-700, 
            .dark-mode .text-pink-600 {
              color: #F472B6 !important;
              text-shadow: 0 0 10px rgba(244, 114, 182, 0.3) !important; /* เพิ่มแสงเรืองรองอ่อนๆ ให้หัวข้อ */
            }
            .dark-mode .text-pink-500, 
            .dark-mode .text-pink-400 {
              color: #F9A8D4 !important;
            }

            /* ข้อความหัวเว็บที่ไล่สี */
            .dark-mode .bg-gradient-to-r.from-pink-500.to-pink-400 {
              background-image: linear-gradient(to right, #F9A8D4, #FBCFE8) !important;
              color: #F9A8D4 !important;
              -webkit-text-fill-color: transparent;
              filter: drop-shadow(0 2px 8px rgba(249, 168, 212, 0.3)); /* เรืองแสง */
            }

            /* ฟองอากาศลอยๆ กลายเป็นลูกแก้วเรืองแสงในความมืด */
            .dark-mode .bubble-gradient {
              background: radial-gradient(circle at 30% 30%, rgba(244, 114, 182, 0.4), rgba(45, 24, 69, 0.1)) !important;
              box-shadow: inset -5px -5px 10px rgba(0, 0, 0, 0.5), 0 0 20px rgba(244, 114, 182, 0.2) !important; /* ฟองเรืองแสง */
              border: 1px solid rgba(244, 114, 182, 0.1) !important;
            }

            /* --- แก้ไขจุดนี้: ปรับแสงเรืองแสงด้านหลังกล่อง Nuni Store ให้เข้ากับโหมดมืด --- */
            .dark-mode .bg-gradient-to-r.from-pink-200.via-white.to-pink-200 {
                background-image: linear-gradient(to right, rgba(236, 72, 153, 0.3), rgba(168, 85, 247, 0.3), rgba(236, 72, 153, 0.3)) !important;
            }

            /* ช่อง Input และ Select ให้ดูล้ำๆ */
            .dark-mode input, .dark-mode select {
              background: rgba(17, 8, 31, 0.7) !important;
              color: #F8FAFC !important;
              border-color: rgba(244, 114, 182, 0.3) !important;
              box-shadow: inset 0 2px 4px rgba(0,0,0,0.5) !important;
            }
            .dark-mode input:focus, .dark-mode select:focus {
              border-color: #F472B6 !important;
              box-shadow: 0 0 0 2px rgba(244, 114, 182, 0.2), inset 0 2px 4px rgba(0,0,0,0.5) !important; /* แสงสว่างตอนกดพิมพ์ */
            }
            .dark-mode input::placeholder, .dark-mode select::placeholder {
              color: #64748B !important;
            }

            .dark-mode .border-pink-200, .dark-mode .border-pink-300, .dark-mode .border-pink-100 {
              border-color: rgba(244, 114, 182, 0.2) !important;
            }
            
            /* Navbar โปร่งแสงสวยๆ */
            .dark-mode nav {
              background: rgba(17, 8, 31, 0.8) !important;
              backdrop-filter: blur(12px) !important;
              -webkit-backdrop-filter: blur(12px) !important;
              border-bottom-color: rgba(244, 114, 182, 0.1) !important;
            }

            /* ตารางเช็คคิว */
            .dark-mode td { color: #F8FAFC !important; }
            .dark-mode th { color: #F9A8D4 !important; background: rgba(45, 24, 69, 0.8) !important; border-bottom-color: rgba(249, 168, 212, 0.15) !important;}
            .dark-mode .border-b.border-gray-50 { border-color: rgba(249, 168, 212, 0.05) !important; }
            
            .dark-mode .bg-gray-800 { background-color: rgba(45, 24, 69, 0.9) !important; }
            .dark-mode .hover\\:bg-gray-50:hover, 
            .dark-mode .hover\\:bg-pink-50:hover, 
            .dark-mode .hover\\:bg-pink-50\\/50:hover {
               background-color: rgba(244, 114, 182, 0.15) !important;
            }
            
            /* ป้ายสถานะต่างๆ ให้อ่านง่ายในที่มืด */
            .dark-mode .text-red-500, .dark-mode .text-red-700 { color: #FCA5A5 !important; }
            .dark-mode .bg-red-50, .dark-mode .bg-red-100 { background-color: rgba(127, 29, 29, 0.4) !important; border-color: rgba(248, 113, 113, 0.4) !important; }
            .dark-mode .text-yellow-700 { color: #FDE047 !important; }
            .dark-mode .bg-yellow-100 { background-color: rgba(113, 63, 18, 0.4) !important; border-color: rgba(250, 204, 21, 0.4) !important; }
            .dark-mode .text-green-700 { color: #86EFAC !important; }
            .dark-mode .bg-green-100 { background-color: rgba(20, 83, 45, 0.4) !important; border-color: rgba(74, 222, 128, 0.4) !important; }
          `}</style>
        );

        // --- STREAMING_CHUNK:Component พื้นหลัง ---
        const AnimatedBackground = () => (
          <div className="fixed inset-0 pointer-events-none overflow-hidden z-0">
            <svg className="absolute top-[10%] left-[10%] w-8 h-8 text-pink-300 anim-float-1" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
            </svg>
            <svg className="absolute top-[20%] right-[20%] w-6 h-6 text-pink-200 anim-pulse" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3 c1.74 0 3.41.81 4.5 2.09 C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5 c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
            <div className="absolute left-[5%] w-10 h-10 bubble-gradient anim-bubble" style={{animationDelay: '-1s', animationDuration: '8.8s'}}></div>
            <div className="absolute left-[15%] w-16 h-16 bubble-gradient anim-bubble" style={{animationDelay: '-3s', animationDuration: '13.2s'}}></div>
            <div className="absolute left-[35%] w-8 h-8 bubble-gradient anim-bubble" style={{animationDelay: '-5s', animationDuration: '9.9s'}}></div>
            <div className="absolute left-[50%] w-20 h-20 bubble-gradient anim-bubble" style={{animationDelay: '-7s', animationDuration: '15.4s'}}></div>
            <div className="absolute left-[65%] w-12 h-12 bubble-gradient anim-bubble" style={{animationDelay: '-2s', animationDuration: '11s'}}></div>
            <div className="absolute left-[80%] w-14 h-14 bubble-gradient anim-bubble" style={{animationDelay: '-4s', animationDuration: '12.1s'}}></div>
            <div className="absolute left-[95%] w-9 h-9 bubble-gradient anim-bubble" style={{animationDelay: '-6s', animationDuration: '10.45s'}}></div>
           
            <svg className="absolute top-[50%] left-[10%] w-6 h-6 text-pink-300 anim-pulse" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5L12 0Z"/>
            </svg>
            <svg className="absolute top-[60%] right-[5%] w-8 h-8 text-yellow-300 anim-pulse anim-drift" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8L12 2z"/>
            </svg>
            <svg className="absolute top-[80%] left-[10%] w-6 h-6 text-pink-200 anim-float-4 anim-drift" style={{animationDelay: '3s'}} viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8L12 2z"/>
            </svg>
          </div>
        );

        // --- STREAMING_CHUNK:Custom Dialog แทนที่ Alert ---
        const CustomDialog = ({ isOpen, message, isConfirm, onConfirm, onClose }) => {
          if (!isOpen) return null;
          return (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fade-in-up">
              <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl text-center border-2 border-pink-200">
                <div className="mx-auto w-14 h-14 bg-pink-100 text-pink-500 rounded-full flex items-center justify-center mb-4 shadow-inner">
                  <AlertCircle size={28} />
                </div>
                <p className="text-gray-800 text-lg mb-6 font-medium">{message}</p>
                <div className="flex justify-center gap-3">
                  {isConfirm && (
                    <button 
                      onClick={onClose}
                      className="w-full px-4 py-2.5 bg-gray-100 text-gray-700 rounded-xl hover:bg-gray-200 transition font-bold"
                    >
                      ยกเลิก
                    </button>
                  )}
                  <button 
                    onClick={() => {
                      if (isConfirm && onConfirm) onConfirm();
                      else onClose();
                    }}
                    className="w-full px-4 py-2.5 bg-gradient-to-r from-pink-400 to-pink-500 text-white rounded-xl hover:from-pink-500 hover:to-pink-600 transition font-bold shadow-md"
                  >
                    ตกลง
                  </button>
                </div>
              </div>
            </div>
          );
        };

        // --- STREAMING_CHUNK:Main Application Component ---
        function App() {
          const [currentPage, setCurrentPage] = useState('home');
          const [isDarkMode, setIsDarkMode] = useState(false);
          const [queues, setQueues] = useState([
            { id: 'Q-001', queueNumber: 1, style:  'ป้าย ads' , type:  'บัญชี' , contact: 'Line: @demo1', status:  'เสร็จแล้ว' , date: new Date().toLocaleString('th-TH') },
            { id: 'Q-002', queueNumber: 2, style:  'แนวเฮด' , type:  'เรทเมนูแอพ' , contact: 'FB: User Demo', status:  'กำลังทำ' , date: new Date().toLocaleString('th-TH') },
          ]);
          const [showReceipt, setShowReceipt] = useState(false);
          const [currentOrder, setCurrentOrder] = useState(null);
          const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);

          // Dialog State สำหรับเรียกใช้แทน alert
          const [dialog, setDialog] = useState({ isOpen: false, message: '', isConfirm: false, onConfirm: null });

          const showMessage = (message) => setDialog({ isOpen: true, message, isConfirm: false, onConfirm: null });
          const showConfirm = (message, onConfirm) => setDialog({ isOpen: true, message, isConfirm: true, onConfirm });
          const closeDialog = () => setDialog({ ...dialog, isOpen: false });

          // Helper for Logo
          const Logo = ({ size = 'md' }) => (
            <div className={`${size === 'lg' ? 'w-24 h-24' : 'w-12 h-12'} rounded-full bg-pink-200 flex items-center justify-center overflow-hidden border-4 border-white shadow-lg mx-auto`}>
              <img 
                src="logo.png" 
                alt="โลโก้ร้านมัวมัว" 
                className="w-full h-full object-cover"
              />
            </div>
          );

          return (
            <div className={`bg-gradient-to-t from-pink-100 to-white min-h-screen relative text-gray-800 ${isDarkMode ? 'dark-mode' : ''}`} style={{ fontFamily: "'Prompt', sans-serif" }}>
              <BackgroundStyle />
              <AnimatedBackground />
              
              <CustomDialog 
                isOpen={dialog.isOpen} 
                message={dialog.message} 
                isConfirm={dialog.isConfirm} 
                onConfirm={() => {
                  if (dialog.onConfirm) dialog.onConfirm();
                  closeDialog();
                }}
                onClose={closeDialog} 
              />

              <nav className="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-pink-100 shadow-sm">
                <div className="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
                  <div className="flex items-center gap-3 cursor-pointer" onClick={() => setCurrentPage('home')}>
                    <Logo size="sm" />
                    <span className="text-xl font-bold text-pink-600 tracking-wide"> Nuni Store </span>
                  </div>
                 
                  <div className="flex gap-2 sm:gap-4 text-sm sm:text-base">
                    <button onClick={() => setCurrentPage('home')} className={`px-3 py-2 rounded-full transition-all ${currentPage === 'home' ? 'bg-pink-500 text-white shadow-md' : 'text-pink-600 hover:bg-pink-50'}`}> หน้าแรก </button>
                    <button onClick={() => setCurrentPage('queue')} className={`px-3 py-2 rounded-full transition-all ${currentPage === 'queue' ? 'bg-pink-500 text-white shadow-md' : 'text-pink-600 hover:bg-pink-50'}`}> เช็คคิว </button>
                    <button onClick={() => setCurrentPage('contact')} className={`px-3 py-2 rounded-full transition-all ${currentPage === 'contact' ? 'bg-pink-500 text-white shadow-md' : 'text-pink-600 hover:bg-pink-50 hidden sm:block'}`}> ติดต่อ </button>
                    
                    {/* ปุ่มสลับโหมด มืด/สว่าง แบบสวิตช์เลื่อนซ้าย-ขวา */}
                    <button 
                      onClick={() => setIsDarkMode(!isDarkMode)} 
                      className={`relative w-16 h-8 rounded-full transition-colors duration-300 flex items-center px-1 ${isDarkMode ? 'bg-[#220B3D]' : 'bg-[#f0f0f5]'}`}
                      style={{ boxShadow: 'inset 0px 2px 5px rgba(0,0,0,0.1)' }}
                      title={isDarkMode ? "เปลี่ยนเป็นโหมดสว่าง" : "เปลี่ยนเป็นโหมดมืด"}
                    >
                      <div 
                        className={`absolute w-6 h-6 bg-white rounded-full shadow-md flex items-center justify-center transform transition-transform duration-300 ${isDarkMode ? 'translate-x-8' : 'translate-x-0'}`}
                      >
                        {isDarkMode ? <Moon size={14} className="text-yellow-400" fill="#facc15" /> : <Sun size={14} className="text-yellow-400" fill="#facc15" />}
                      </div>
                    </button>
                    
                    <button onClick={() => setCurrentPage('admin')} className="p-2 text-pink-400 hover:text-pink-600 transition-colors"><Shield size={20} /></button>
                  </div>
                </div>
              </nav>

              <main className="relative z-10 max-w-4xl mx-auto px-4 py-8 pb-24">
                {currentPage === 'home' && (
                  <HomeView
                    Logo={Logo}
                    setQueues={setQueues}
                    queues={queues}
                    setCurrentOrder={setCurrentOrder}
                    setShowReceipt={setShowReceipt}
                    showMessage={showMessage}
                  />
                )}
                {currentPage === 'queue' && <QueueView queues={queues} />}
                {currentPage === 'contact' && <ContactView />}
                {currentPage === 'admin' && (
                  <AdminView
                    isAdminLoggedIn={isAdminLoggedIn}
                    setIsAdminLoggedIn={setIsAdminLoggedIn}
                    queues={queues}
                    setQueues={setQueues}
                    showMessage={showMessage}
                    showConfirm={showConfirm}
                  />
                )}
              </main>

              {showReceipt && currentOrder && (
                <ReceiptModal
                  order={currentOrder}
                  onClose={() => setShowReceipt(false)}
                  showMessage={showMessage}
                />
              )}
            </div>
          );
        }

        // --- STREAMING_CHUNK:Home View Component ---
        function HomeView({ Logo, setQueues, queues, setCurrentOrder, setShowReceipt, showMessage }) {
          const [formStyle, setFormStyle] = useState( 'ป้าย ads' );
          const [formType, setFormType] = useState( 'ป้ายเครดิต' );
          const [formContact, setFormContact] = useState('');

          const today = new Date();
          const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
          const thaiDate = today.toLocaleDateString('th-TH', dateOptions);
         
          const handleOrderSubmit = (e) => {
            e.preventDefault();
            if(!formContact) {
              showMessage( 'กรุณากรอกช่องทางการติดต่อค่ะ' );
              return;
            }

            const nextQNum = queues.length > 0 ? Math.max(...queues.map(q => parseInt(q.queueNumber) || 0)) + 1 : 1;
            const generateId = `Q-${Math.floor(1000 + Math.random() * 9000)}`;
            const now = new Date().toLocaleString('th-TH');

            const newOrder = {
              id: generateId,
              queueNumber: nextQNum,
              style: formStyle,
              type: formType,
              contact: formContact,
              status:  'ยังไม่เริ่มทำ' ,
              date: now
            };

            setQueues([...queues, newOrder]);
            setCurrentOrder(newOrder);
            setShowReceipt(true);
            setFormContact(''); 
          };

          return (
            <div className="space-y-8 animate-fade-in-up">
              <div className="text-center space-y-4 pt-4">

        // --- STREAMING_CHUNK:Admin View Component ---
        function AdminView({ isAdminLoggedIn, setIsAdminLoggedIn, queues, setQueues, showMessage, showConfirm }) {
          const [user, setUser] = useState('');
          const [pass, setPass] = useState('');
         
          const [showModal, setShowModal] = useState(false);
          const [isEditing, setIsEditing] = useState(false);
          const [formData, setFormData] = useState({
            id: '', queueNumber: '', style:  'ป้าย ads' , type:  'ป้ายเครดิต' , contact: '', status:  'ยังไม่เริ่มทำ'
          });

          const handleLogin = (e) => {
            e.preventDefault();
            if(user === 'master' && pass === '1111') {
              setIsAdminLoggedIn(true);
            } else {
              showMessage( 'รหัสผ่านไม่ถูกต้อง' );
            }
          };

          const updateStatus = (id, newStatus) => {
            const updated = queues.map(q => q.id === id ? { ...q, status: newStatus } : q);
            setQueues(updated);
          };

          const deleteQueue = (id) => {
            showConfirm('ต้องการลบคิวนี้ใช่หรือไม่?', () => {
              setQueues(queues.filter(q => q.id !== id));
            });
          };

          const handleOpenAdd = () => {
            const nextQNum = queues.length > 0 ? Math.max(...queues.map(q => parseInt(q.queueNumber) || 0)) + 1 : 1;
            setFormData({
              id: `Q-${Math.floor(1000 + Math.random() * 9000)}`,
              queueNumber: nextQNum,
              style:  'ป้าย ads' ,
              type:  'ป้ายเครดิต' ,
              contact: '',
              status:  'ยังไม่เริ่มทำ' ,
              date: new Date().toLocaleString('th-TH')
            });
            setIsEditing(false);
            setShowModal(true);
          };

          const handleOpenEdit = (q) => {
            setFormData({ ...q });
            setIsEditing(true);
            setShowModal(true);
          };

          const handleSaveForm = (e) => {
            e.preventDefault();
            if(!formData.contact) {
              showMessage( 'กรุณากรอกข้อมูลติดต่อ' );
              return;
            }

            if (isEditing) {
              setQueues(queues.map(q => q.id === formData.id ? formData : q));
            } else {
              setQueues([...queues, formData]);
            }
            setShowModal(false);
          };

          if(!isAdminLoggedIn) {
            return (
              <div className="max-w-sm mx-auto mt-12 bg-white/90 backdrop-blur-md rounded-3xl p-8 shadow-2xl border border-pink-100 animate-fade-in-up">
                <div className="flex justify-center mb-6">
                  <div className="bg-gray-100 w-16 h-16 rounded-full flex items-center justify-center text-gray-400">
                    <Shield size={32} />
                  </div>
                </div>
                <h2 className="text-2xl font-bold text-center text-gray-700 mb-6"> เข้าสู่ระบบหลังบ้าน </h2>
                <form onSubmit={handleLogin} className="space-y-4">
                  <input
                    type="text" placeholder="Username (master)"
                    value={user} onChange={(e)=>setUser(e.target.value)}
                    className="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 outline-none focus:border-pink-400 font-sans"
                  />
                  <input
                    type="password" placeholder="Password (1111)"
                    value={pass} onChange={(e)=>setPass(e.target.value)}
                    className="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 outline-none focus:border-pink-400 font-sans"
                  />
                  <button type="submit" className="w-full bg-gray-800 hover:bg-black text-white font-bold py-3 rounded-xl transition shadow-md">
                    Login
                  </button>
                </form>
              </div>
            );
          }

          return (
            <div className="space-y-6 animate-fade-in-up relative">
              <div className="flex justify-between items-center bg-gray-800 text-white rounded-2xl p-4 shadow-lg">
                <div className="flex items-center gap-2">
                  <Shield className="text-pink-400" />
                  <span className="font-bold">Admin Dashboard</span>
                </div>
                <button onClick={() => setIsAdminLoggedIn(false)} className="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg text-sm flex items-center gap-2 transition">
                  <LogOut size={16} /> ออกจากระบบ
                </button>
              </div>

              <div className="bg-white/90 backdrop-blur-md rounded-3xl shadow-lg border border-pink-50 overflow-hidden">
                <div className="p-4 bg-pink-50 border-b border-pink-100 flex justify-between items-center flex-wrap gap-3">
                  <h3 className="font-bold text-pink-700 text-lg"> จัดการคิวทั้งหมด  ({queues.length}  คิว )</h3>
                  <button
                    onClick={handleOpenAdd}
                    className="bg-pink-500 hover:bg-pink-600 text-white px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 shadow-sm transition"
                  >
                    <Plus size={16}  /> เพิ่มคิวใหม่
                  </button>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-sm border-collapse min-w-[700px]">
                    <thead>
                      <tr className="bg-gray-50 text-gray-600">
                        <th className="p-3 border-b font-medium"> ลำดับคิว </th>
                        <th className="p-3 border-b font-medium"> รหัสคิว </th>
                        <th className="p-3 border-b font-medium"> ข้อมูลติดต่อ </th>
                        <th className="p-3 border-b font-medium"> รายการ  ( แนว / ประเภท )</th>
                        <th className="p-3 border-b font-medium"> เปลี่ยนสถานะด่วน </th>
                        <th className="p-3 border-b font-medium text-center"> จัดการ </th>
                      </tr>
                    </thead>
                    <tbody>
                      {queues.length === 0 ? (
                        <tr><td colSpan="6" className="p-6 text-center text-gray-400"> ยังไม่มีข้อมูลคิว </td></tr>
                      ) : queues.map((q) => (
                        <tr key={q.id} className="border-b border-gray-100 hover:bg-gray-50 transition">
                          <td className="p-3">{q.queueNumber}</td>
                          <td className="p-3 font-bold text-pink-600">{q.id}</td>
                          <td className="p-3">{q.contact}</td>
                          <td className="p-3 text-gray-600">{q.style} - {q.type}</td>
                          <td className="p-3">
                            <select
                              value={q.status}
                              onChange={(e) => updateStatus(q.id, e.target.value)}
                              className="bg-white border border-gray-300 rounded-lg px-2 py-1.5 outline-none text-xs focus:ring-1 focus:ring-pink-400 cursor-pointer w-full max-w-[120px]"
                            >
                              <option value= "ยังไม่เริ่มทำ" > ยังไม่เริ่มทำ </option>
                              <option value= "กำลังทำ" > กำลังทำ </option>
                              <option value= "เสร็จแล้ว" > เสร็จแล้ว </option>
                            </select>
                          </td>
                          <td className="p-3">
                            <div className="flex justify-center gap-2">
                              <button onClick={() => handleOpenEdit(q)} className="text-blue-500 hover:text-blue-700 bg-blue-50 hover:bg-blue-100 p-1.5 rounded transition" title= "แก้ไข" >
                                <Edit size={16} />
                              </button>
                              <button onClick={() => deleteQueue(q.id)} className="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 p-1.5 rounded transition" title= "ลบ" >
                                <X size={16} />
                              </button>
                            </div>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>

              {showModal && (
                <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                  <div className="bg-white rounded-3xl w-full max-w-md shadow-2xl overflow-hidden">
                    <div className="bg-gradient-to-r from-pink-400 to-pink-500 p-4 text-white flex justify-between items-center">
                      <h3 className="font-bold text-lg flex items-center gap-2">
                        {isEditing ? <Edit size={18} /> : <Plus size={18} />}
                        {isEditing ?  'แก้ไขข้อมูลคิว'  :  'เพิ่มคิวใหม่' }
                      </h3>
                      <button onClick={() => setShowModal(false)} className="text-white/80 hover:text-white"><X size={20}/></button>
                    </div>
                   
                    <form onSubmit={handleSaveForm} className="p-6 space-y-4">
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-medium text-gray-500 mb-1"> รหัสคิว </label>
                          <input type="text" value={formData.id} readOnly className="w-full bg-gray-100 border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-500 outline-none" />
                        </div>
                        <div>
                          <label className="block text-xs font-medium text-gray-500 mb-1"> ลำดับคิว </label>
                          <input
                            type="number"
                            value={formData.queueNumber}
                            onChange={(e)=>setFormData({...formData, queueNumber: e.target.value})}
                            className="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-pink-400"
                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-medium text-gray-500 mb-1"> ช่องทางการติดต่อ </label>
                        <input
                          type="text"
                          value={formData.contact}
                          onChange={(e)=>setFormData({...formData, contact: e.target.value})}
                          className="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 outline-none focus:border-pink-400"
                          placeholder= "เช่น Line: @myline"
                        />
                      </div>

                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-medium text-gray-500 mb-1"> แนวป้าย </label>
                          <select
                            value={formData.style}
                            onChange={(e)=>setFormData({...formData, style: e.target.value})}
                            className="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-pink-400"
                          >
                            <option value= "ป้าย ads" > ป้าย ads </option>
                            <option value= "ป้ายท้องฟ้า" > ป้ายท้องฟ้า </option>
                            <option value= "แนวเฮด" > แนวเฮด </option>
                          </select>
                        </div>
                        <div>
                          <label className="block text-xs font-medium text-gray-500 mb-1"> ประเภทป้าย </label>
                          <select
                            value={formData.type}
                            onChange={(e)=>setFormData({...formData, type: e.target.value})}
                            className="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-pink-400"
                          >
                            <option value= "ป้ายเครดิต" > ป้ายเครดิต </option>
                            <option value= "บัญชี" > บัญชี </option>
                            <option value= "เรทเมนูแอพ" > เรทเมนูแอพ </option>
                          </select>
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-medium text-gray-500 mb-1"> สถานะงาน </label>
                        <select
                          value={formData.status}
                          onChange={(e)=>setFormData({...formData, status: e.target.value})}
                          className="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 outline-none focus:border-pink-400"
                        >
                          <option value= "ยังไม่เริ่มทำ" > ยังไม่เริ่มทำ </option>
                          <option value= "กำลังทำ" > กำลังทำ </option>
                          <option value= "เสร็จแล้ว" > เสร็จแล้ว </option>
                        </select>
                      </div>

                      <div className="pt-4 flex gap-2">
                        <button type="button" onClick={() => setShowModal(false)} className="w-1/2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 rounded-xl transition">
                          ยกเลิก
                        </button>
                        <button type="submit" className="w-1/2 bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 rounded-xl transition flex justify-center items-center gap-2 shadow-md">
                          <Save size={18} /> บันทึก
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              )}
            </div>
          );
        }

        // --- STREAMING_CHUNK:สั่งให้ React ทำงาน ---
        // คำสั่งบังคับให้ React เอาโค้ดทั้งหมดไปแสดงใน <div id="root">
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
